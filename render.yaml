services:
  - type: web
    name: hr-system
    env: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: hr-system-db
      - key: SECRET_KEY
        value: your-secret-key
      - key: BASE_URL
        value: https://your-service.onrender.com
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: your@gmail.com
      - key: SMTP_PASSWORD
        value: your-app-password
      - key: MAIL_FROM
        value: your@gmail.com
      - key: MAIL_FROM_NAME
        value: Interview Platform

databases:
  - name: hr-system-db
    engine: postgresql
    plan: starter
    version: 15
    region: oregon
